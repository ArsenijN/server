<!DOCTYPE html>
<html lang="{lang}"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FluxDrop — {t:sp_login_title}</title>
<link rel="icon" type="image/png" sizes="64x64" href="/fluxdrop_pp/icon-64.png">
<link rel="stylesheet" href="/fluxdrop_pp/assets/Inter.css">
<style>
*{box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#f0f9ff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:16px}
.card{background:white;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.1);padding:36px;max-width:380px;width:100%;text-align:center}
input{width:100%;padding:10px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:Inter,sans-serif;margin-bottom:10px;outline:none;transition:border .15s}
input:focus{border-color:#3b82f6}
.btn{width:100%;padding:11px;background:#3b82f6;color:white;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s;font-family:Inter,sans-serif}
.btn:hover{background:#2563eb}
.btn:disabled{background:#93c5fd;cursor:not-allowed}
.err{color:#ef4444;font-size:13px;margin-top:6px;min-height:18px}
</style>
</head><body>
<div class="card">
  <div style="font-size:46px;margin-bottom:12px">🔒</div>
  <h2 style="margin:0 0 6px;color:#1e293b;font-size:20px">{t:sp_login_required}</h2>
  <p style="color:#64748b;font-size:13px;margin:0 0 22px">{t:sp_login_needs_account}</p>

  <input type="text"     id="usr" placeholder="{t:username}"  autocomplete="username">
  <input type="password" id="pwd" placeholder="{t:password}"  autocomplete="current-password">
  <button class="btn" id="login-btn" onclick="doLogin()">{t:sp_login_continue}</button>
  <div class="err" id="err"></div>

  <div style="margin-top:16px;font-size:12px;color:#94a3b8">
    {t:sp_already_logged}
    <a href="#" onclick="useStoredToken()" style="color:#3b82f6;text-decoration:none">{t:sp_use_saved}</a>
  </div>
</div>

<script>
const CDN = {cdn_origin};
const SHARE = {share_path};
const _T = { noSaved: {tjs:sp_no_saved}, enter: {tjs:sp_enter_credentials}, loggingIn: {tjs:sp_logging_in},
             failed: {tjs:sp_login_failed}, cont: {tjs:sp_login_continue}, network: {tjs:sp_network_error} };

function useStoredToken() {
  const t = localStorage.getItem('fluxdrop_token');
  if (!t) { document.getElementById('err').textContent = _T.noSaved; return; }
  redirect(t);
}

async function doLogin() {
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('err');
  const usr = document.getElementById('usr').value.trim();
  const pwd = document.getElementById('pwd').value;
  if (!usr || !pwd) { err.textContent = _T.enter; return; }
  btn.disabled = true; btn.textContent = _T.loggingIn; err.textContent = '';
  try {
    const r = await fetch(CDN + '/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: usr, password: pwd})
    });
    const data = await r.json();
    if (!r.ok) { err.textContent = data.error || _T.failed; btn.disabled = false; btn.textContent = _T.cont; return; }
    localStorage.setItem('fluxdrop_token', data.token);
    localStorage.setItem('fluxdrop_username', data.username);
    redirect(data.token);
  } catch(e) {
    err.textContent = _T.network + e.message;
    btn.disabled = false; btn.textContent = _T.cont;
  }
}

function redirect(token) {
  window.location.href = CDN + SHARE + '?token=' + encodeURIComponent(token);
}

(function() {
  const t = localStorage.getItem('fluxdrop_token');
  if (t) redirect(t);
})();
</script>
</body></html>
