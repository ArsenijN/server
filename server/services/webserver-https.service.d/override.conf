# Drop-in for webserver-https.service (copy to
# /etc/systemd/system/webserver-https.service.d/override.conf, then
# `sudo systemctl daemon-reload && sudo systemctl restart webserver-https`).
# Keeps the front server's memory in check: fewer glibc malloc arenas, freed
# memory returned to the OS sooner, and a hard cap.
[Service]
Environment=MALLOC_ARENA_MAX=2
Environment=MALLOC_MMAP_THRESHOLD_=131072
Environment=MALLOC_TRIM_THRESHOLD_=131072
MemoryMax=1G
