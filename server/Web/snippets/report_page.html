<!DOCTYPE html>
<html lang="{lang}"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FluxDrop — {t:rp_title_plain}</title>
<link rel="icon" type="image/png" sizes="64x64" href="/fluxdrop_pp/icon-64.png">
<link rel="stylesheet" href="/fluxdrop_pp/assets/Inter.css">
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}
:root{--bg:#f0f9ff;--card:#fff;--text:#1e293b;--muted:#64748b;--label:#374151;--line:#e2e8f0;--input:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#1a2535;--text:#e2e8f0;--muted:#94a3b8;--label:#cbd5e1;--line:#2d3f52;--input:#0d1520}}
body{font-family:Inter,sans-serif;background:var(--bg);min-height:100vh;margin:0;padding:24px 16px;color:var(--text)}
.card{background:var(--card);border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.1);padding:28px;max-width:560px;margin:0 auto}
h1{margin:0 0 6px;font-size:20px}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
label{display:block;font-size:13px;font-weight:600;color:var(--label);margin-top:16px}
input[type=text],input[type=email],input[type=url],textarea{display:block;width:100%;margin-top:5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:var(--input);color:inherit}
textarea{min-height:110px;resize:vertical}
fieldset{border:none;padding:0;margin:16px 0 0}
legend{font-size:13px;font-weight:600;color:var(--label);padding:0}
.reasons label{display:flex;gap:9px;align-items:flex-start;font-weight:500;margin-top:8px;cursor:pointer}
.reasons input{margin-top:3px}
.hint{font-weight:400;color:var(--muted);font-size:12px}
.btn{margin-top:20px;padding:10px 22px;background:#dc2626;color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.6;cursor:default}
.msg{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:13px;background:#fef2f2;color:#b91c1c}
.msg[hidden]{display:none}
.done{text-align:center;padding:12px 0;clear:both}
.foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
.foot a{color:#3b82f6;text-decoration:none}
.langs{float:right;display:flex;gap:2px;margin:-4px -6px 0 8px}
.langs a{padding:3px 7px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none}
.langs a[aria-current=true]{background:#e0f2fe;color:#0369a1}
</style>
</head><body>
<div class="card" id="card">
  <nav class="langs" aria-label="Language">{LANG_LINKS}</nav>
  {BODY}
  <div class="foot">
    {t:rp_privacy}<br>
    <a href="/">FluxDrop</a> · <a href="/?policy=tos">{t:footer_tos}</a> · <a href="/?policy=pp">{t:footer_pp}</a>
  </div>
</div>
<script>
/* Optional: send in place (no reload) and attach the signed-in account.
   Without JS the form posts to /report and the server answers with a page. */
(function () {
  const form = document.getElementById('rf');
  if (!form || !window.fetch) return;
  const T = {
    send: {tjs:rp_send}, sending: {tjs:rp_sending}, rate: {tjs:rp_e_rate},
    doneTitle: {tjs:rp_done_title}, doneBody: {tjs:rp_done_body}, generic: {GENERIC_JS},
    e: { bad_url: {tjs:rp_e_bad_url}, bad_reason: {tjs:rp_e_bad_reason},
         message_required: {tjs:rp_e_message_required}, bad_email: {tjs:rp_e_bad_email} },
  };
  const err = document.getElementById('rf-err');
  const btn = document.getElementById('rf-send');
  const show = m => { err.textContent = m; err.hidden = false; };
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    err.hidden = true;
    const fd = new FormData(form);
    const payload = {
      url: String(fd.get('url') || '').trim(), reason: String(fd.get('reason') || ''),
      message: String(fd.get('message') || ''), email: String(fd.get('email') || '').trim(),
    };
    if (!payload.url) return show(T.e.bad_url);
    if (!payload.reason) return show(T.e.bad_reason);
    if (payload.reason === 'other' && !payload.message.trim()) return show(T.e.message_required);
    const headers = { 'Content-Type': 'application/json' };
    try { const tok = localStorage.getItem('fluxdrop_token'); if (tok) headers.Authorization = 'Bearer ' + tok; } catch (e) {}
    btn.disabled = true; btn.textContent = T.sending;
    try {
      const r = await fetch('/api/v1/report', { method: 'POST', headers, body: JSON.stringify(payload) });
      const d = await r.json().catch(() => ({}));
      if (r.ok) {
        const card = document.getElementById('card');
        card.querySelectorAll(':scope > h1, :scope > p.muted, #rf').forEach(n => n.remove());
        const done = document.createElement('div');
        done.className = 'done';
        done.innerHTML = '<div style="font-size:42px" aria-hidden="true">✅</div><h1></h1><p class="muted"></p>';
        done.querySelector('h1').textContent = T.doneTitle;
        done.querySelector('p').textContent = T.doneBody.replace('{id}', d.id);
        card.querySelector('.foot').before(done);
        return;
      }
      show(r.status === 429 ? T.rate : (T.e[d.code] || T.generic));
    } catch (e) {
      show(T.generic);
    }
    btn.disabled = false; btn.textContent = T.send;
  });
})();
</script>
</body></html>
